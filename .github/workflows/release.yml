name: Release (TestFlight)

# Manual TestFlight build & upload. Manual signing: the distribution cert
# (p12) and App Store provisioning profile live in repo secrets — created once
# via the App Store Connect API. The ASC API key authenticates the upload
# itself (`destination: upload` in ci/exportOptions.plist). Manual signing is
# required because the team has no registered devices and the API key's role
# cannot mint cloud-signed certs ("Cloud signing permission error").
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID            App Store Connect API key ID       (e.g. 2X9R4HXF34)
#   ASC_ISSUER_ID         App Store Connect API issuer ID    (UUID)
#   ASC_KEY_P8_BASE64     base64 of the AuthKey_<id>.p8 file (`base64 -i AuthKey.p8`)
#   DIST_P12_BASE64       base64 of the distribution cert+key .p12
#   DIST_P12_PASSWORD     password the .p12 was exported with
#   DIST_PROFILE_BASE64   base64 of the App Store .mobileprovision
#
# One-time App Store Connect setup (Account Holder / Admin):
#   1. Create the app record for bundle id com.getdatasurge.sightline.field.
#   2. Users and Access → Integrations → App Store Connect API → generate a
#      team key with role "App Manager" (or higher); download the .p8 ONCE.
#   3. Create the distribution cert + App Store profile (via API or Xcode).
#   4. Add the six secrets above.
# Team ID (S67XP8A7UZ) is committed in project.yml + ci/exportOptions.plist.

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.2
        # Match the SDK/toolchain to the current App Store submission stack; see
        # ci.yml for why the image default (16.4) is not used.
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Stamp build number
        # Unique, monotonic build number per run — TestFlight rejects duplicates.
        # Runs after `xcodegen generate` because it regenerates Info.plist.
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" SightLineField/Info.plist \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" SightLineField/Info.plist

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KEY_DIR="$RUNNER_TEMP/asc_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        # Archive unsigned (CODE_SIGNING_ALLOWED=NO): with Automatic signing the
        # archive step tries to mint a *development* profile, which requires a
        # registered device — the team has none, and CI is headless. The export
        # step below re-signs with the App Store distribution profile fetched via
        # the ASC API key, which needs no devices.
        run: |
          xcodebuild archive \
            -project SightLineField.xcodeproj \
            -scheme SightLineField \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SightLineField.xcarchive" \
            -skipPackagePluginValidation \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Install signing identity + profile
        # Import the distribution cert into an ephemeral keychain and drop the
        # App Store profile where Xcode looks for it. The keychain is destroyed
        # with the runner; the p12 password lives only in secrets.
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          DIST_PROFILE_BASE64: ${{ secrets.DIST_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ci.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$DIST_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/SightLineField_AppStore.mobileprovision"

      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SightLineField.xcarchive" \
            -exportOptionsPlist ci/exportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
