name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          # The image's first-listed iPhone is an iOS 26.2 sim, which SIGTRAPs under
          # the test host regardless of Xcode (16.4 and 26.2 both crashed). Use the
          # simulator runtime the selected Xcode actually ships and supports: iOS 18.5
          # under Xcode 16.4. Select by UDID so the name can't mis-match.
          SIM_LINE=$(xcrun simctl list devices available | awk '/-- iOS 18/{f=1;next} /^--/{f=0} f && /iPhone/{print; exit}')
          SIM_ID=$(echo "$SIM_LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$SIM_ID" ]; then
            SIM_LINE=$(xcrun simctl list devices available | grep -m1 -E '^\s+iPhone')
            SIM_ID=$(echo "$SIM_LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          fi
          echo "Using simulator: $SIM_LINE"
          xcodebuild -project SightLineField.xcodeproj -scheme SightLineField \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -skipPackagePluginValidation build test
      - name: Dump simulator crash reports (on failure)
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os, glob
          files = sorted(
              glob.glob(os.path.expanduser("~/Library/Logs/DiagnosticReports/SightLineField-*.ips")),
              key=os.path.getmtime,
          )
          print(f"found {len(files)} crash reports; dumping 3 most recent")
          for f in files[-3:]:
              print("=====", os.path.basename(f))
              raw = fh.read()
              body = None
              for candidate in (raw, "\n".join(raw.splitlines()[1:]), raw.splitlines()[1] if len(raw.splitlines()) > 1 else raw):
                  try:
                      body = json.loads(candidate)
                      break
                  except Exception:
                      continue
              if body is None:
                  print("  (unparseable; first 40 lines:)")
                  print("\n".join(raw.splitlines()[:40]))
                  continue
              imgs = body.get("usedImages", [])
              for i, t in enumerate(body.get("threads", [])):
                  if not t.get("triggered"):
                      continue
                  print(f"--- crashed thread {i} name={t.get('name')} queue={t.get('queue')}")
                  for fr in t.get("frames", [])[:40]:
                      ii = fr.get("imageIndex", 0)
                      img = imgs[ii].get("name", "?") if ii < len(imgs) else "?"
                      print(f"  {img} :: {fr.get('symbol', '?')} +{fr.get('symbolLocation', '?')}")
          PY
