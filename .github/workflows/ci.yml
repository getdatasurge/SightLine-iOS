name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -m1 -E '^\s+iPhone' | sed -E 's/^ +//; s/ \(.*//')
          echo "Using simulator: $SIM_NAME"
          xcodebuild -project SightLineField.xcodeproj -scheme SightLineField \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -skipPackagePluginValidation build test
      - name: Dump simulator crash reports (on failure)
        if: failure()
        run: |
          shopt -s nullglob
          echo "=== DiagnosticReports ==="
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -15
          for f in ~/Library/Logs/DiagnosticReports/SightLine*.ips \
                   ~/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/CrashReporter/*.ips; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            head -1 "$f"
            awk '/^Thread [0-9]+ Crashed/{flag=1;print;next} /^Thread [0-9]+/{flag=0} flag' "$f" | head -80
          done
          true
