name: SightLineField
options:
  bundleIdPrefix: com.getdatasurge.sightline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
schemes:
  SightLineField:
    build:
      targets:
        SightLineField: all
        SightLineFieldTests: [test]
        SightLineFieldUITests: [test]
    test:
      targets: [SightLineFieldTests, SightLineFieldUITests]
packages:
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.5.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.0.2
  OpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator
    from: 1.7.0
  HTTPTypes:
    url: https://github.com/apple/swift-http-types
    from: 1.5.0
targets:
  SightLineField:
    type: application
    platform: iOS
    sources: [SightLineField]
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: OpenAPIGenerator
    dependencies:
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIURLSession
        product: OpenAPIURLSession
    info:
      path: SightLineField/Info.plist
      properties:
        CFBundleDisplayName: SightLine Field
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.getdatasurge.sightline.field.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getdatasurge.sightline.field
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
  SightLineFieldTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SightLineFieldTests]
    dependencies:
      - target: SightLineField
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: HTTPTypes
        product: HTTPTypes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SightLineFieldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SightLineFieldUITests]
    dependencies:
      - target: SightLineField
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
